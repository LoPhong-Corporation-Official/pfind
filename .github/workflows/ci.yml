name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DPFIND_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Completion scripts are valid (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y zsh
          ./build/pfind --completion bash | bash -n
          ./build/pfind --completion zsh | zsh -n
          ./build/pfind --completion powershell > pfind.ps1
          pwsh -NoProfile -File tools/check-ps-syntax.ps1 pfind.ps1
